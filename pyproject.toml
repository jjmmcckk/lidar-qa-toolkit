[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidarqa"
version = "0.1.0"
description = "QA for LAS/LAZ point clouds: density, coverage gaps against an AOI, and classification summaries, with an HTML report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jordan McKenzie" }]
requires-python = ">=3.10"
dependencies = [
    "laspy[lazrs]>=2.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lidar-qa = "lidarqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
